<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Milk Dairy System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="enter-page">
    <div class="enter-card">
        <h2 style="color: var(--secondary-color);">Admin Login</h2>
        <form id="adminLoginForm" class="mt-2">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="ranjithsang62@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="12345678">
            </div>
            <button type="submit" class="btn btn-secondary btn-block">Login</button>
        </form>
        <p class="mt-2"><a href="../enter.html">Back to Home</a></p>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (login(email, pass, 'admin')) {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>

</html>
