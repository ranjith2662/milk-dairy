<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Milk Dairy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container d-flex justify-between align-center">
            <div class="nav-brand">Milk Dairy Admin</div>
            <div class="nav-links">
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="manage-products.html">Products</a>
                <a href="manage-orders.html">Orders</a>
                <a href="#" class="active" style="color:var(--secondary-color)">Users</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Manage Users</h2>
        <table class="mt-2">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
        </table>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('admin');

        function renderUsers() {
            const users = getAllUsers();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${u.blocked ? '<span style="color:red">Blocked</span>' : '<span style="color:green">Active</span>'}</td>
                    <td>
                        <button class="btn btn-secondary" style="background-color: ${u.blocked ? 'green' : 'orange'}; padding: 5px 10px; font-size: 0.8rem;" onclick="toggleBlock(${u.id})">
                            ${u.blocked ? 'Unblock' : 'Block'}
                        </button>
                        <button class="btn btn-danger" style="padding: 5px 10px; font-size: 0.8rem;" onclick="removeUser(${u.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleBlock(id) {
            toggleBlockUser(id);
            renderUsers();
        }

        function removeUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                deleteUser(id);
                renderUsers();
            }
        }

        renderUsers();
    </script>
</body>

</html>
