<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Milk Dairy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container d-flex justify-between align-center">
            <div class="nav-brand">Milk Dairy</div>
            <div class="nav-links">
                <a href="#" class="active">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="profile.html">Profile</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card animate-fade-in" style="text-align:center; padding: 60px 40px;">
            <h1 style="color: var(--primary-color);">Welcome Back, <span id="userName">User</span>!</h1>
            <p class="mt-1">Fresh dairy products are just a click away.</p>

            <div class="d-flex" style="justify-content: center; gap: 20px; margin-top: 30px;">
                <a href="products.html" class="btn btn-primary">Browse Products</a>
                <a href="curr_orders.html" onclick="window.location.href='orders.html'; return false;"
                    class="btn btn-secondary">View Orders</a>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('user');
        const user = getCurrentUser();
        if (user) {
            document.getElementById('userName').innerText = user.name;
        }
    </script>
</body>

</html>
