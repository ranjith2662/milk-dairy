<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Milk Dairy System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="enter-page">
    <div class="enter-card">
        <h2>User Login</h2>
        <form id="userLoginForm" class="mt-2">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="user@milk.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="user123">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="mt-2 text-center" style="font-size: 0.9rem;">New User? <a href="user-register.html"
                style="color:var(--primary-color); font-weight:bold;">Register here</a></p>
        <p class="mt-1 text-center"><a href="../enter.html">Back to Home</a></p>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('userLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (login(email, pass, 'user')) {
                window.location.href = 'user-dashboard.html';
            }
        });
    </script>
</body>

</html>
