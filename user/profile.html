<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Milk Dairy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container d-flex justify-between align-center">
            <div class="nav-brand">Milk Dairy</div>
            <div class="nav-links">
                <a href="user-dashboard.html">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="#" class="active" style="color:var(--primary-color)">Profile</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2 class="mb-2">Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="pName" required>
                </div>
                <div class="form-group">
                    <label>Email (cannot change)</label>
                    <input type="email" id="pEmail" disabled style="background:#eee">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="pAddress" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="pPhone" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">Update Profile</button>
            </form>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('user');

        const user = getCurrentUser();
        if (user) {
            document.getElementById('pName').value = user.name;
            document.getElementById('pEmail').value = user.email;
            document.getElementById('pAddress').value = user.address || '';
            document.getElementById('pPhone').value = user.phone || '';
        }

        document.getElementById('profileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const updated = {
                name: document.getElementById('pName').value,
                address: document.getElementById('pAddress').value,
                phone: document.getElementById('pPhone').value
            };

            updateProfile(updated);
            alert('Profile updated successfully!');
        });
    </script>
</body>

</html>
