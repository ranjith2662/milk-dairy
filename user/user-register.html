<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Register - Milk Dairy System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="enter-page">
    <div class="enter-card animate-slide-up">
        <h2>Create Account</h2>
        <form id="registerForm" class="mt-2" style="text-align: left;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="user@milk.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" required placeholder="Au!2#dk">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="regAddress" required placeholder="123 Milk Street">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="regPhone" required placeholder="9876543210">
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-2">Register</button>
        </form>
        <p class="mt-2 text-center">Already have an account? <a href="user-login.html"
                style="color:var(--primary-color); font-weight:bold;">Login here</a></p>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const address = document.getElementById('regAddress').value;
            const phone = document.getElementById('regPhone').value;

            if (register(name, email, pass, address, phone)) {
                window.location.href = 'user-login.html';
            }
        });
    </script>
</body>

</html>
